[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"        # v4 needs transient storage (EIP-1153)
via_ir = true
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 5_000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
# Blockscout verification. The key can be any non-empty string.
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api/", chain = 4663 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
